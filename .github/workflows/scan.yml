name: scan
on:
  schedule:
    - cron: "*/5 4-11 * * 1-5"   # every 5 min, 09:00-16:55 PKT, Mon-Fri (script checks real market hours)
  workflow_dispatch:
    inputs:
      force:
        description: "Run even when the market is closed (testing)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan
        run: python scanner.py
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CAPITAL: ${{ vars.CAPITAL }}
          RISK_PCT: ${{ vars.RISK_PCT }}
      - name: Save results
        run: |
          git config user.name "psx-bot"
          git config user.email "psx-bot@users.noreply.github.com"
          git add docs/signals.enc.json
          git diff --cached --quiet || (git commit -m "update signals" && git pull --rebase && git push)
